[project]
name = "modelcheck"
version = "0.1.0"
description = "Evidence-grounded classification experiment review agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.10", "openai>=1.60",
  "mcp>=2.3", "httpx>=0.28", "python-dotenv>=1.0", "pytest>=8.0",
  "numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.6"
]

[project.scripts]
modelcheck = "modelcheck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

